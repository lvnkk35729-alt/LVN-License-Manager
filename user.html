<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LVN User Panel</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- USER LOGIN -->

  <div
    class="login-container"
    id="userLogin"
  >

    <div class="login-box">

      <div class="logo">
        LVN
      </div>

      <h1>
        User Login
      </h1>

      <p class="subtitle">
        License User Panel
      </p>


      <input
        type="email"
        id="email"
        placeholder="Email"
      >


      <input
        type="password"
        id="password"
        placeholder="Password"
      >


      <button
        type="button"
        class="login-btn user-btn"
        id="loginButton"
      >
        Login
      </button>


      <p id="loginMessage"></p>

    </div>

  </div>



  <!-- USER PANEL -->

  <div
    id="userPanel"
    style="display:none;"
  >


    <header class="dashboard-header">

      <div>

        <h2>
          LVN User Panel
        </h2>

        <p>
          License Information
        </p>

      </div>


      <button
        type="button"
        id="logoutButton"
        class="logout-btn"
      >
        Logout
      </button>

    </header>



    <main class="dashboard">


      <div class="license-card">

        <div class="license-icon">
          🔐
        </div>


        <h1 id="licenseStatus">
          🔴 LICENSE DEACTIVATED
        </h1>


        <p id="statusText">
          Your license is currently inactive.
        </p>

      </div>



      <div class="info-grid">


        <div class="info-card">

          <h3>
            User ID
          </h3>

          <p id="userId">
            —
          </p>

        </div>



        <div class="info-card">

          <h3>
            License Code
          </h3>

          <p id="licenseCode">
            —
          </p>

        </div>



        <div class="info-card">

          <h3>
            License Duration
          </h3>

          <p id="licenseDuration">
            —
          </p>

        </div>



        <div class="info-card">

          <h3>
            Expiry
          </h3>

          <p id="expiry">
            —
          </p>

        </div>


      </div>


    </main>


  </div> <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBxOeP1or0k5z3Itk7weYZfcY4hG84-wB4",

      authDomain:
        "lvn-licence-manager-1f8fb.firebaseapp.com",

      projectId:
        "lvn-licence-manager-1f8fb",

      storageBucket:
        "lvn-licence-manager-1f8fb.firebasestorage.app",

      messagingSenderId:
        "1045739350275",

      appId:
        "1:1045739350275:web:087bf256bf7c6ee6e0a136"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    const loginScreen =
      document.getElementById("userLogin");

    const userPanel =
      document.getElementById("userPanel");

    const loginMessage =
      document.getElementById("loginMessage");


    document
      .getElementById("loginButton")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;


        if (!email || !password) {

          loginMessage.innerText =
            "Enter email and password.";

          return;

        }


        loginMessage.innerText =
          "Logging in...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          loginMessage.innerText = "";

        } catch (error) {

          console.error(error);

          loginMessage.innerText =
            "Invalid email or password.";

        }

      });


    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          loginScreen.style.display =
            "block";

          userPanel.style.display =
            "none";

          return;

        }


        loginScreen.style.display =
          "none";

        userPanel.style.display =
          "block";


        await loadUser(user.uid);

      }
    );


    async function loadUser(uid) {

      const userRef =
        doc(db, "users", uid);

      const userSnap =
        await getDoc(userRef);


      if (!userSnap.exists()) {

        const generatedId =
          generateUserId();


        await setDoc(
          userRef,
          {

            uid: uid,

            userId: generatedId,

            email:
              auth.currentUser.email,

            licenseActive:
              false,

            licenseCode:
              "",

            duration:
              0,

            expiresAt:
              null,

            createdAt:
              Date.now()

          }
        );


        displayUser(
          generatedId,
          false,
          "",
          0,
          null
        );

        return;

      }


      const data =
        userSnap.data();


      displayUser(

        data.userId || "—",

        data.licenseActive === true,

        data.licenseCode || "",

        data.duration || 0,

        data.expiresAt || null

      );

    }
